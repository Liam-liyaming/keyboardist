<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>键盘手 · 每日之歌可视化</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #06080c; overflow: hidden; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; color: #e8eef8; }
  #c { width: 100vw; height: 100vh; display: block; }
  #hud {
    position: fixed; left: 20px; bottom: 18px;
    font-size: 12px; letter-spacing: .04em; color: #8a94a6;
    font-variant-numeric: tabular-nums; pointer-events: none;
  }
  #hint {
    position: fixed; right: 20px; bottom: 18px;
    font-size: 12px; color: #4b5566; pointer-events: none;
  }
  #start {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 60%, #0d141d 0%, #06080c 70%);
    cursor: pointer; text-align: center;
  }
  #start h1 { font-size: 34px; font-weight: 500; letter-spacing: .18em; color: #e8eef8; margin-bottom: 14px; }
  #start p { font-size: 13px; color: #5d6878; letter-spacing: .08em; }
  #start .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: #5eeae8; margin-right: 8px; box-shadow: 0 0 12px #5eeae8; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<audio id="audio" src="swift-ambient-v3.m4a" preload="auto"></audio>
<div id="hud"></div>
<div id="dump" style="display:none"></div>
<div id="hint">空格 播放/暂停 · 1 光河 · 2 声谱 · 3 呼吸</div>
<div id="start">
  <div>
    <h1>每日之歌</h1>
    <p><span class="dot"></span>点击开始</p>
  </div>
</div>
<script src="notes.js"></script>
<script src="visualizer.js"></script>
</body>
</html>
