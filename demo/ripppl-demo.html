<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>键盘手 · ripppl 冲击波</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#06080c; overflow:hidden; }
  body { font-family:-apple-system,"PingFang SC",sans-serif; color:#e8eef8; }

  #app {
    position:relative; width:100vw; height:100vh; overflow:hidden;
    background:radial-gradient(120% 80% at 50% 120%, #0d141d 0%, #06080c 62%);
    padding: 64px 96px;
  }
  h1 { font-size:44px; font-weight:600; letter-spacing:.02em; }
  .meta { margin-top:10px; font-size:14px; color:#7f8b9e; letter-spacing:.04em; }
  .lines { margin-top:56px; display:flex; flex-direction:column; gap:22px; }
  .line { height:10px; border-radius:5px; background:rgba(232,238,248,.18); }
  .panels { margin-top:64px; display:flex; gap:24px; }
  .panel {
    flex:1; height:120px; border-radius:14px;
    background:rgba(94,234,232,.05); border:1px solid rgba(94,234,232,.18);
    padding:18px 20px; font-size:13px; color:rgba(94,234,232,.75);
  }
  #hint {
    position:fixed; left:96px; bottom:22px; font-size:12px; color:#4b5566;
  }
  #fire {
    position:fixed; right:96px; bottom:18px; padding:10px 18px; border-radius:999px;
    border:1px solid rgba(94,234,232,.28); background:rgba(94,234,232,.08);
    color:#9ff0ee; font-size:13px; cursor:pointer;
  }
  #dump { display:none; }
</style>
</head>
<body>
<div id="app">
  <h1>每日之歌</h1>
  <div class="meta">2026-11-23 · BPM 82 · 88 秒 · <span id="preset">balanced</span></div>

  <div class="lines">
    <div class="line" style="width:72%"></div>
    <div class="line" style="width:86%"></div>
    <div class="line" style="width:64%"></div>
    <div class="line" style="width:78%"></div>
    <div class="line" style="width:52%"></div>
    <div class="line" style="width:83%"></div>
    <div class="line" style="width:69%"></div>
    <div class="line" style="width:74%"></div>
  </div>

  <div class="panels">
    <div class="panel">字数 179<br>会话 18 段</div>
    <div class="panel">击键 1012<br>速度 84/分</div>
  </div>

  <div id="hint">回车 / 空格触发 · 1 轻 · 2 中 · 3 重</div>
  <button id="fire">点我触发</button>
</div>
<div id="dump"></div>

<script src="vendor/ripppl.global.js"></script>
<script src="ripppl-demo.js"></script>
</body>
</html>
